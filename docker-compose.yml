services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: headache_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d headache_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/headache_tracker
      JWT_SECRET_KEY: local-development-secret-change-before-deploy
      CORS_ORIGINS: '["http://localhost","http://127.0.0.1"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
